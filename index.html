<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sift — Daily Ranking Puzzle</title>
  <meta name="description" content="Eight cards. Five belong. One right order. A daily knowledge puzzle in six guesses.">
  <meta name="theme-color" content="#101218">
  <meta property="og:title" content="Sift — Daily Ranking Puzzle">
  <meta property="og:description" content="Eight cards. Five belong. One right order.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23101218'/%3E%3Crect x='6' y='7' width='20' height='4' rx='2' fill='%233fae74'/%3E%3Crect x='8' y='14' width='16' height='4' rx='2' fill='%23e3a937'/%3E%3Crect x='11' y='21' width='10' height='4' rx='2' fill='%236b7280'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <button class="icon-btn" id="btnHelp" aria-label="How to play">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M9.5 9.2a2.6 2.6 0 0 1 5 .9c0 1.8-2.5 2.3-2.5 3.9"/><circle cx="12" cy="17.2" r=".6" fill="currentColor"/></svg>
      </button>
      <div class="brand">
        <span class="logo" aria-label="Sift">
          <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>SIFT
        </span>
        <span class="tag" id="puzzleNo"></span>
      </div>
      <div class="top-right">
        <button class="icon-btn" id="btnStats" aria-label="Statistics">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>
        </button>
        <button class="icon-btn" id="btnSettings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
    </header>

    <nav class="modes" role="tablist" aria-label="Game mode">
      <button role="tab" data-mode="daily" class="on" aria-selected="true">Daily</button>
      <button role="tab" data-mode="practice" aria-selected="false">Practice</button>
    </nav>

    <main>
      <section class="prompt">
        <div class="chip" id="cat"></div>
        <h1 id="ask"></h1>
        <p class="sub" id="sub">Find the 5 that belong, then rank them.</p>
      </section>

      <section class="potbar" id="potbar" aria-label="Points pot">
        <div class="pot-top">
          <span class="pot-label">Pot</span>
          <span class="pot-num" id="potNum">1,000</span>
          <span class="pot-hint" id="potHint"></span>
        </div>
        <div class="pot-track"><i id="potFill"></i></div>
      </section>

      <div class="axis" aria-hidden="true">
        <span class="axis-hi" id="axisHi"></span>
        <span class="axis-line"></span>
        <span class="axis-lo">#5</span>
      </div>

      <section class="board" id="board" aria-label="Guesses"></section>

      <div class="progress" id="progress" aria-live="polite"></div>

      <section class="deck" id="deck" aria-label="Cards"></section>

      <section class="actions" id="actions">
        <div class="powerups">
          <button class="btn power" id="btnStake" title="Bet on one tile: +150 if it lands green, −150 if it’s a decoy">
            <span class="pw-ico" aria-hidden="true">🔥</span><span class="pw-name">Stake</span><span class="pw-cost">±150</span>
          </button>
          <button class="btn power" id="btnReveal" title="See one card’s true value (twice per game)">
            <span class="pw-ico" aria-hidden="true">👁</span><span class="pw-name">Reveal</span><span class="pw-cost">−120</span>
          </button>
          <button class="btn power" id="btnHint" title="Expose one decoy (once per game)">
            <span class="pw-ico" aria-hidden="true">✦</span><span class="pw-name">Expose</span><span class="pw-cost">−200</span>
          </button>
        </div>
        <div class="mainacts">
          <button class="btn ghost" id="btnClear">Clear</button>
          <button class="btn primary" id="btnSubmit">Submit</button>
        </div>
      </section>
      <section class="actions done-actions" id="doneActions" hidden>
        <button class="btn ghost" id="btnResults">See results</button>
        <button class="btn primary" id="btnNext">Play practice</button>
      </section>
    </main>

    <footer class="foot">A new puzzle every day at midnight · <a href="#" id="linkHelp">How to play</a></footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="overlay" id="overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="icon-btn close" id="modalClose" aria-label="Close">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div id="modalBody"></div>
    </div>
  </div>

  <canvas id="confetti" aria-hidden="true"></canvas>

  <script src="puzzles.js"></script>
  <script src="app.js"></script>
</body>
</html>
